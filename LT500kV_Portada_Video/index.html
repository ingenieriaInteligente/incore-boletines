<!doctype html>
<html lang="es">
<head>

<style>
:root{--azul:#00AAFA;--naranja:#FC7C00;--gris:#7E83A4;--claro:#F5F7FA;--oscuro:#021222;--tools:#65728a;--stage:#dce6f0;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-behavior:auto}body{margin:0;background:var(--claro);color:var(--oscuro);font:16px system-ui,"Segoe UI",Arial,sans-serif}
.site-head{background:var(--oscuro);color:white;padding:12px clamp(12px,3vw,42px);display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:86px}
.brand{display:flex;align-items:center;gap:16px;min-width:0}.brand-mark{width:clamp(132px,15vw,190px);flex:0 0 auto;min-width:0;display:flex;align-items:center}.logo{display:block;width:100%;height:auto;max-height:70px;object-fit:contain}.logo-fallback{font-size:24px;font-weight:900;white-space:nowrap}.logo-fallback span:first-child{color:var(--azul)}.logo-fallback span:last-child{color:var(--naranja)}
.heading{min-width:0}.heading strong{font-size:clamp(14px,1.25vw,18px);line-height:1.3;display:block}.heading small{display:block;color:#dae4f0;line-height:1.35;margin-top:3px}.label{color:#dae4f0;font-size:12px;white-space:nowrap}
main{max-width:1560px;margin:auto;padding:12px clamp(8px,1.6vw,24px) 30px}
.toolbar{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;margin:0 auto 12px}.primary-actions,.reader-actions{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
button{background:var(--azul);border:0;border-radius:9px;padding:11px 13px;color:white;font:700 14px system-ui,"Segoe UI",Arial,sans-serif;cursor:pointer;min-height:44px;touch-action:manipulation}
button.secondary{background:var(--tools)}button.accent{background:var(--naranja)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible{outline:3px solid var(--naranja);outline-offset:3px}
#counter{font-weight:750;white-space:nowrap;padding:0 8px}#zoomLabel{min-width:64px}#mode{min-width:116px}
.view{background:var(--stage);border-radius:16px;overflow:visible;min-height:0;padding:16px}
.page-shell{width:max-content;min-width:100%;margin:auto;display:flex;justify-content:center;align-items:flex-start}
#page{display:block;width:700px;height:auto;max-width:none;box-shadow:0 10px 26px #02122233;background:white}
#warning{display:none;background:#fff1f0;border:1px solid #ed9c96;color:#a11d1d;padding:14px;border-radius:10px;margin:0 auto 12px;max-width:720px}
.index{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:14px 0}.index button{background:#e5edf6;color:var(--oscuro);min-width:44px}.index button.active{background:var(--naranja);color:white}

/* Controles cortos para tactil; etiquetas completas en escritorio. */
.mobile-label{display:none}
@media(max-width:1024px){
 .site-head{min-height:0;padding:10px 18px}
 main{padding-top:8px}
 .toolbar{gap:7px;margin-bottom:8px}

 .reader-actions{width:100%;justify-content:center}
 .hint{margin:4px auto 8px}
 .index{padding:8px 0}
}
@media(max-width:600px){
 /* Cabecera movil: el identificador tecnico ocupa su propia fila; nunca invade el titulo. */

 .brand{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center;width:100%;min-width:0}
 .brand-mark{width:96px;max-width:100%}.logo{width:100%;max-height:44px}.logo-fallback{font-size:17px}
 .heading{min-width:0;overflow-wrap:anywhere}

 .label{display:block;justify-self:end;min-width:0;max-width:100%;font-size:10px;line-height:1.2;text-align:right;white-space:normal;overflow-wrap:anywhere}
 .heading small{display:none}
 main{padding:6px 5px 16px}
 .toolbar{display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
 .primary-actions{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:5px;align-items:center}
 .primary-actions button{width:100%;min-width:0;padding:7px 4px;min-height:40px;font-size:12px}
 .primary-actions #counter{font-size:12px;text-align:center;padding:0 2px}

 .reader-actions #zoomLabel{min-width:0;font-size:12px}
 .reader-actions #mode{min-width:0}
 .desktop-label{display:none}
 .mobile-label{display:inline}
 .view{padding:5px;border-radius:10px}
 .hint{font-size:10px;line-height:1.2;margin:4px auto 5px}
 .index{gap:4px;padding:6px 0}
 .index button{min-width:38px;min-height:38px;padding:6px}

}
@media(max-width:380px){

/* Modo lectura: una sola barra (documento). Modo pantalla completa: una sola barra (visor). */
html:fullscreen{height:100%;overflow:hidden}
html:fullscreen body{height:100%;overflow:hidden;display:flex;flex-direction:column}
html:fullscreen .site-head{flex:0 0 auto}
html:fullscreen main{flex:1 1 auto;min-height:0;width:100%;max-width:none;display:flex;flex-direction:column;padding-bottom:8px}
html:fullscreen .toolbar{flex:0 0 auto}
html:fullscreen .view{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
html:fullscreen .hint{flex:0 0 auto;margin:5px auto}
html:fullscreen .index{flex:0 0 auto;padding:5px 0}
html:fullscreen .author-footer{flex:0 0 auto;margin-top:3px;padding:6px 10px}

@media(orientation:landscape) and (max-height:500px){.site-head{padding:6px 12px;min-height:0}.heading small{display:none}}

/* PORTADA UNIVERSAL INCORE: contenido HTML independiente, sin PNG de fondo. */
#coverBox{position:relative;flex:0 0 auto;box-shadow:0 10px 26px #02122233}
#cover{position:absolute;top:0;left:0;width:1055px;height:1491px;transform-origin:top left;overflow:hidden;background:var(--oscuro);color:#fff;font-family:system-ui,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column}

.u-heading{padding:30px 55px 15px}.u-topic{color:var(--azul);font-size:21px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin:0 0 18px}
.u-title{font-size:56px;line-height:1.1;letter-spacing:-1.1px;overflow-wrap:anywhere;margin:0;color:white;font-weight:850}

.u-footer{margin-top:auto;padding:21px 55px 24px;border-top:1px solid #33506a;display:flex;justify-content:space-between;align-items:center;gap:18px;color:#bac8da;font-size:17px}
.u-footer strong{color:#fff}

/* v0.2.1 · Ajuste editorial: geometría corporativa independiente del tema. */
#cover{isolation:isolate}
#cover::before{content:"";position:absolute;z-index:-1;pointer-events:none;top:140px;right:-155px;width:560px;height:610px;transform:skewX(-27deg);background:linear-gradient(90deg,transparent 0 22%,rgba(0,170,250,.055) 22% 48%,rgba(0,170,250,.13) 48% 63%,rgba(126,131,164,.065) 63% 82%,transparent 82%)}
#cover::after{content:"";position:absolute;z-index:-1;pointer-events:none;bottom:96px;left:-150px;width:460px;height:250px;transform:skewX(-30deg);background:linear-gradient(90deg,transparent,rgba(0,170,250,.045),transparent)}
.u-top{padding-top:46px;padding-bottom:18px}
.u-heading{padding-top:39px;padding-bottom:26px}
.u-topic{margin-bottom:22px}
.u-title{font-size:64px;line-height:1.075;letter-spacing:-1.7px;max-width:960px}
.u-title .title-accent{color:var(--naranja)}
.u-subtitle{font-size:28px;margin-top:23px}
.u-underline{margin-top:30px;width:112px}
.u-player-area{padding-top:26px;padding-bottom:23px}
.u-video-frame{border-color:rgba(0,170,250,.75);background:#0a1d32}
.u-about{padding-top:36px;padding-bottom:44px;display:flex;flex-direction:column;justify-content:flex-start}
.u-about h2{font-size:33px;margin-bottom:21px}
.u-about p{font-size:24px;line-height:1.64}
.u-footer{padding-top:26px;padding-bottom:27px}

/* v0.2.2 - Barra redundante retirada: control de pantalla completa nativo de video. */
.u-head-right{display:flex;flex-direction:column;align-items:flex-end;gap:13px}
.u-page-number{font-size:26px;font-weight:800;color:#fff;letter-spacing:1px;font-variant-numeric:tabular-nums;white-space:nowrap}
.u-page-number::before{content:"";display:inline-block;vertical-align:middle;background:var(--naranja);height:4px;width:49px;margin-right:13px}
.u-player-area{padding-bottom:6px}
.u-about{padding-top:16px;padding-bottom:26px;justify-content:flex-start}
.u-about h2{font-size:33px;margin-bottom:13px}
.u-about p{font-size:23px;line-height:1.51}
.u-footer{flex-shrink:0;padding-top:22px;padding-bottom:23px}
</style>

</head>
<body>
<header class="site-head"><div class="brand"><div class="brand-mark"><img id="logo" class="logo" alt="INCORE Knowledge Studio" hidden><div id="logoFallback" class="logo-fallback" role="img" aria-label="INCORE Knowledge Studio"><span>IN</span><span>CORE</span></div></div><div class="heading"><strong id="title">Boletín Técnico</strong><small id="subtitle"></small></div></div><span class="label">INCORE Flipbook Viewer v2.2.4 · Responsive</span></header>
<main>
<section class="toolbar" role="toolbar" aria-label="Controles del libro">
 <div class="primary-actions"><button class="secondary" id="prev" type="button">❮ Anterior</button><span id="counter" aria-live="polite">Página 1</span><button id="next" type="button">Siguiente ❯</button></div>
 <div class="reader-actions"><button id="less" class="secondary" type="button" aria-label="Reducir zoom" title="Reducir zoom"><span class="desktop-label">− Zoom</span><span class="mobile-label" aria-hidden="true">−</span></button><button id="zoomLabel" class="secondary" type="button" title="Restablecer al ajuste automático">100%</button><button id="more" class="secondary" type="button" aria-label="Aumentar zoom" title="Aumentar zoom"><span class="desktop-label">+ Zoom</span><span class="mobile-label" aria-hidden="true">+</span></button><button id="mode" class="secondary" type="button" aria-label="Ajustar ancho" title="Alternar entre ajustar página y ancho"><span class="desktop-label" id="modeText">Ajustar página</span><span class="mobile-label" aria-hidden="true">↔</span></button><button id="full" class="accent" type="button" aria-label="Pantalla completa" title="Pantalla completa"><span class="desktop-label">Pantalla completa</span><span class="mobile-label" aria-hidden="true">⛶</span></button></div>
</section>
<div id="warning" role="alert"></div>
<div class="view" id="view" tabindex="0" aria-label="Área desplazable de lectura"><div class="page-shell" id="pageShell"><img id="page" alt="Página del boletín"><div id="coverBox" hidden><article id="cover" aria-label="Portada universal del boletín">
<div class="u-accent"></div><div class="u-top"><div><img class="u-mark" id="coverLogo" alt="INCORE Knowledge Studio" hidden><div class="u-mark-fallback" id="coverLogoFallback"><span class="in">IN</span><span class="core">CORE</span><small>Knowledge Studio</small></div></div><div class="u-head-right"><div class="u-kind" id="coverCategory">BOLETÍN INTERACTIVO</div><div class="u-page-number" id="coverTopNumber">01 / 09</div></div></div>
<div class="u-heading"><p class="u-topic" id="coverTopic"></p><h1 class="u-title" id="coverTitle"></h1><p class="u-subtitle" id="coverSubtitle"></p><div class="u-underline"></div></div>
<div class="u-player-area"><div class="u-video-frame"><video id="coverVideo" controls playsinline preload="metadata" aria-label="Video de presentación">Tu navegador no admite video HTML5.</video><img id="coverPicture" alt="Imagen de portada" hidden></div></div>

<div class="u-footer"><span id="coverAuthor"></span><strong id="coverNumber">Página 1</strong></div>
</article></div></div></div>
<p class="hint">Ajustar página / ancho · Zoom con desplazamiento · Navega con ← → o los números inferiores</p>

<footer class="author-footer" id="authorFooter" aria-label="Autoría del boletín" hidden><span id="authorText"></span></footer>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), c=window.INCORE_CONFIG, warning=$('warning'), image=$('page'), view=$('view'), cover=$('cover'), coverBox=$('coverBox'), video=$('coverVideo');
function warn(msg){warning.textContent=msg;warning.style.display='block'}
if(!c||!Number.isInteger(c.totalPaginas)||c.totalPaginas<1||c.totalPaginas>500){warn('Configuración inválida: compruebe config.js y totalPaginas (1–500).');return}
for(const [k,css] of Object.entries({azul:'--azul',naranja:'--naranja',gris:'--gris',fondoClaro:'--claro',fondoOscuro:'--oscuro'})){const v=c.colores?.[k];if(typeof v==='string'&&/^#[0-9a-fA-F]{6}$/.test(v))document.documentElement.style.setProperty(css,v)}
$('title').textContent=c.titulo||'Boletín Técnico';$('subtitle').textContent=c.subtitulo||'';
// Nuevo contrato configurable: portada. Compatibilidad de lectura con portadaMultimedia existente.
const p=c.portada||{};
$('coverCategory').textContent=p.categoria||'BOLETÍN INTERACTIVO';
$('coverTopic').textContent=p.tema||'';
$('coverTopic').hidden=!p.tema;
const coverTitleText=p.titulo||c.titulo||'Título del boletín';
const highlight=typeof p.tituloResaltado==='string'?p.tituloResaltado.trim():'';
const highlightPos=highlight?coverTitleText.toLocaleLowerCase('es').indexOf(highlight.toLocaleLowerCase('es')):-1;
if(highlightPos>=0){
  const titleNode=$('coverTitle');
  titleNode.append(document.createTextNode(coverTitleText.slice(0,highlightPos)));
  const accent=document.createElement('span');accent.className='title-accent';accent.textContent=coverTitleText.slice(highlightPos,highlightPos+highlight.length);
  titleNode.append(accent,document.createTextNode(coverTitleText.slice(highlightPos+highlight.length)));
}else $('coverTitle').textContent=coverTitleText;
$('coverSubtitle').textContent=p.subtitulo||c.subtitulo||'';
$('coverDescription').textContent=p.descripcion||c.portadaMultimedia?.descripcion||'';
$('coverAuthor').textContent=c.autor||'';
$('coverNumber').textContent='Página 1';
$('coverTopNumber').textContent=`01 / ${String(c.totalPaginas).padStart(2,'0')}`;
$('coverAboutTitle').textContent=p.encabezadoDescripcion||'Acerca de este boletín';
const coverLogo=$('coverLogo'),coverLogoFallback=$('coverLogoFallback');
coverLogo.onload=()=>{coverLogo.hidden=false;coverLogoFallback.hidden=true};
coverLogo.onerror=()=>{coverLogo.hidden=true;coverLogoFallback.hidden=false};
coverLogo.src=c.logo||'assets/logo-incore.png';
const type=p.tipo||'video';
if(type==='imagen'){
  video.hidden=true;
  const pic=$('coverPicture');pic.hidden=false;pic.src=p.imagen||'';
  pic.onerror=()=>warn('No se encontró la imagen de portada. Revise portada.imagen en config.js');
}else{
  const path=p.video||c.portadaMultimedia?.video;
  if(path){video.src=path;video.load()}else warn('Falta portada.video en config.js');
}
const author=typeof c.autor==='string'?c.autor.trim():'';$('authorText').textContent=author;$('authorFooter').hidden=!author;
// Mantener una marca visible: mostrar imagen al cargarla, texto de reserva si falla.
const logo=$('logo'), logoFallback=$('logoFallback');
logo.onload=()=>{logo.hidden=false;logoFallback.hidden=true};
logo.onerror=()=>{logo.hidden=true;logoFallback.hidden=false};
logo.src=c.logo||'assets/logo-incore.png';
const safeFolder=String(c.carpetaImagenes||'imagenes').replace(/^\/+|\/+$/g,'');
const source=i=>`${safeFolder}/${c.prefijoPagina||'pagina_'}${String(i+1).padStart(2,'0')}.${c.extension||'png'}`;
let current=0,mode='page',multiplier=1,naturalW=1055,naturalH=1491;
function area(){const s=getComputedStyle(view),isFull=!!document.fullscreenElement;
const availableHeight=isFull ? view.clientHeight : Math.max(220,window.innerHeight-view.getBoundingClientRect().top-72);
return {w:Math.max(100,view.clientWidth-parseFloat(s.paddingLeft)-parseFloat(s.paddingRight)-(isFull?16:0)),h:Math.max(120,availableHeight-parseFloat(s.paddingTop)-parseFloat(s.paddingBottom)-8)}}
function fitWidth(){return Math.min(naturalW,area().w)}
function fitPage(){let a=area();return Math.min(naturalW,a.w,a.h*naturalW/naturalH)}
function dimensions(){const a=area();if(current===0){naturalW=1055;naturalH=1491;}let w=(mode==='width'?fitWidth():fitPage())*multiplier;image.style.width=Math.round(w)+'px';image.style.height='auto';if(current===0){const scale=w/1055;cover.style.transform=`scale(${scale})`;coverBox.style.width=Math.round(w)+'px';coverBox.style.height=Math.ceil(naturalH*scale)+'px';}$('zoomLabel').textContent=Math.round(100*w/naturalW)+'%';$('modeText').textContent=mode==='page'?'Ajustar ancho':'Ajustar página';$('mode').setAttribute('aria-label',mode==='page'?'Ajustar ancho':'Ajustar página');}
function checkCoverDescription(){
  if(current!==0)return;
  const d=$('coverDescription'),styles=getComputedStyle(d),lineHeight=parseFloat(styles.lineHeight);
  if(!lineHeight)return;
  const lines=Math.ceil((d.getBoundingClientRect().height / (cover.getBoundingClientRect().width / 1055))/lineHeight-0.05);
  if(lines>4)warn(`La descripción de portada ocupa ${lines} líneas; máximo permitido: 4. Abrevie portada.descripcion en config.js.`);
  const footer=$('cover').querySelector('.u-footer');
  if(d.getBoundingClientRect().bottom>footer.getBoundingClientRect().top-6)warn('La descripción invade el pie. Abrevie portada.descripcion en config.js.');
}
function resetScroll(){if(document.fullscreenElement)view.scrollTo({top:0,left:0});else window.scrollTo({top:0,left:0})}
function show(){warning.style.display='none';const isCover=current===0;if(!isCover && !video.paused)video.pause();coverBox.hidden=!isCover;image.hidden=isCover;if(isCover){naturalW=1055;naturalH=1491;image.removeAttribute('src');dimensions();requestAnimationFrame(checkCoverDescription)}else{image.src=source(current)};$('counter').textContent=`Página ${current+1} de ${c.totalPaginas}`;$('prev').disabled=current===0;$('next').disabled=current===c.totalPaginas-1;[...$('nav').children].forEach((b,i)=>{b.classList.toggle('active',i===current);b.setAttribute('aria-current',i===current?'page':'false')});resetScroll()}
image.onerror=()=>warn(`No se encontró la imagen de la página ${current+1}: ${source(current)}. Compruebe imagenes/ y que existan pagina_02.png ... pagina_09.png.`);
image.onload=()=>{naturalW=image.naturalWidth||1055;naturalH=image.naturalHeight||1491;warning.style.display='none';dimensions()};
for(let i=0;i<c.totalPaginas;i++){const b=document.createElement('button');b.type='button';b.textContent=i+1;b.title=`Ir a página ${i+1}`;b.onclick=()=>{current=i;show()};$('nav').append(b)}
$('prev').onclick=()=>{if(current>0){current--;show()}};$('next').onclick=()=>{if(current<c.totalPaginas-1){current++;show()}};
function zoom(f){multiplier=Math.max(.5,Math.min(3,Math.round(multiplier*f*100)/100));dimensions()}
$('more').onclick=()=>zoom(1.2);$('less').onclick=()=>zoom(1/1.2);$('zoomLabel').onclick=()=>{multiplier=1;dimensions()};
$('mode').onclick=()=>{mode=mode==='page'?'width':'page';multiplier=1;dimensions();resetScroll()};
$('full').onclick=()=>{if(document.fullscreenElement){document.exitFullscreen?.()}else if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen().catch(()=>warn('Este navegador no permite activar pantalla completa.'))}else warn('Pantalla completa no disponible en este navegador.')};
document.addEventListener('fullscreenchange',()=>{requestAnimationFrame(()=>{if(document.fullscreenElement!==video){dimensions();resetScroll()}})});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','BUTTON','VIDEO'].includes(document.activeElement?.tagName)||document.fullscreenElement===video)return;if(e.key==='ArrowLeft')$('prev').click();else if(e.key==='ArrowRight')$('next').click()});
let resizeScheduled=false;const recalc=()=>{if(resizeScheduled)return;resizeScheduled=true;requestAnimationFrame(()=>{resizeScheduled=false;dimensions()})};window.addEventListener('resize',recalc);if('ResizeObserver' in window)new ResizeObserver(recalc).observe(view);
show();
})();
</script>
</body></html>
