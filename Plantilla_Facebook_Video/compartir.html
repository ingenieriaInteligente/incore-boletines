<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>INCORE · Portada audiovisual</title><meta name="description" content="Presentación audiovisual del boletín técnico LT 500 kV."><meta property="og:type" content="video.other"><meta property="og:locale" content="es_PE"><meta property="og:site_name" content="INCORE Knowledge Studio"><meta property="og:title" content="Construcción de una Línea de Transmisión de 500 kV"><meta property="og:description" content="Presentación audiovisual y acceso directo al boletín técnico interactivo INCORE."><meta property="og:url" content="REEMPLAZAR_URL_ABSOLUTA_COMPARTIR"><meta property="og:video" content="REEMPLAZAR_URL_ABSOLUTA_MP4"><meta property="og:video:secure_url" content="REEMPLAZAR_URL_ABSOLUTA_MP4"><meta property="og:video:type" content="video/mp4"><meta property="og:video:width" content="1920"><meta property="og:video:height" content="1080"><!-- Sin og:image intencionalmente para probar Facebook sin miniatura estática. --><link rel="stylesheet" href="styles.css"><script src="config.js" defer></script></head><body><main><div class="card"><header><img id="logo" alt="INCORE"><div class="heading"><div class="eyebrow">INCORE · BOLETÍN TÉCNICO</div><h1 id="titulo"></h1><p class="subtitle" id="subtitulo"></p></div></header><div class="video-wrap"><video id="video" autoplay muted playsinline controls preload="metadata" aria-label="Presentación audiovisual del boletín"></video></div><div class="controls"><button class="secondary" id="activar" type="button">🔊 Activar sonido</button><span class="state" id="estado" role="status">El video iniciará silenciado si el navegador lo permite.</span></div><div class="signature"><div><span class="eyebrow">Elaboración técnica</span><strong id="firma"></strong><span class="subtle" id="cargo"></span></div><a class="action" id="abrir" href="boletin.html">IR A BOLETÍN →</a></div></div><footer>INCORE Knowledge Studio · Prototipo independiente v0.2</footer></main><script>window.addEventListener('DOMContentLoaded',()=>{const c=window.INCORE_CONFIG;const el=id=>document.getElementById(id);el('logo').src=c.logo;el('titulo').textContent=c.titulo;el('subtitulo').textContent=c.subtitulo;el('firma').textContent=[c.firma.tratamiento,c.firma.nombre].filter(Boolean).join(' ');el('cargo').textContent=c.firma.credencial;el('abrir').textContent=c.boton+' →';el('abrir').href=c.visor;const v=el('video');v.src=c.video;v.muted=true;const status=el('estado');v.play().then(()=>status.textContent='Reproducción automática iniciada sin sonido.').catch(()=>status.textContent='El navegador bloqueó el inicio automático. Pulsa reproducir.');el('activar').onclick=()=>{v.muted=!v.muted;el('activar').textContent=v.muted?'🔊 Activar sonido':'🔇 Silenciar';if(v.paused)v.play().catch(()=>{});};});</script></body></html>
