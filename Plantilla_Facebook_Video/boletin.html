<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>INCORE · Boletín PNG</title><link rel="stylesheet" href="styles.css"><script src="config.js" defer></script>
<style>
.viewer-title{margin:0 0 14px}.nav{display:flex;justify-content:center;align-items:center;gap:12px;margin:15px 0;flex-wrap:wrap}.nav button{cursor:pointer}.nav button:disabled{opacity:.35;cursor:not-allowed}
.viewer{display:flex;align-items:flex-start;justify-content:center;width:100%;overflow:hidden;touch-action:pan-y pinch-zoom;user-select:none;-webkit-user-select:none}
.viewer img{display:block;width:auto;max-width:100%;height:auto;max-height:calc(100dvh - 215px);object-fit:contain;object-position:top center;border-radius:4px;-webkit-user-drag:none}
@media(max-width:600px){.viewer img{max-height:calc(100dvh - 195px)}.nav{gap:7px}.nav button,.nav a{padding:8px}.viewer-title{font-size:clamp(18px,5vw,26px)}}
</style></head><body><main><div class="card"><div class="eyebrow">Boletín técnico INCORE</div>
<h1 id="titulo" class="viewer-title">Boletín</h1><nav class="nav" aria-label="Navegación de páginas"><button class="secondary" id="anterior">← Anterior</button><span id="contador" role="status">Página 1</span><button class="secondary" id="siguiente">Siguiente →</button><a class="secondary" href="index.html">Volver al video</a></nav>
<div class="viewer" id="areaPagina" aria-label="Página del boletín; desliza horizontalmente para navegar"><img id="pagina" alt="Página 1 del boletín" draggable="false" fetchpriority="high"></div>
</div></main><script>
window.addEventListener('DOMContentLoaded',()=>{
 const c=window.INCORE_CONFIG; let n=1; const e=id=>document.getElementById(id);
 e('titulo').textContent=c.titulo;
 function show(){const img=e('pagina'); img.src='imagenes/pagina_'+String(n).padStart(2,'0')+'.png';img.alt='Página '+n+' del boletín';e('contador').textContent='Página '+n+' / '+c.totalPaginas;e('anterior').disabled=n<=1;e('siguiente').disabled=n>=c.totalPaginas;}
 function move(delta){const next=Math.max(1,Math.min(c.totalPaginas,n+delta));if(next!==n){n=next;show();}}
 e('anterior').addEventListener('click',()=>move(-1));e('siguiente').addEventListener('click',()=>move(1));
 document.addEventListener('keydown',ev=>{if(ev.key==='ArrowRight')move(1);if(ev.key==='ArrowLeft')move(-1);});
 let touchStart=null;
 const viewer=e('areaPagina');
 viewer.addEventListener('touchstart',ev=>{if(ev.touches.length!==1){touchStart=null;return;} const t=ev.touches[0];touchStart={x:t.clientX,y:t.clientY};},{passive:true});
 viewer.addEventListener('touchend',ev=>{if(!touchStart||!ev.changedTouches.length)return;const t=ev.changedTouches[0];const dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;touchStart=null;if(Math.abs(dx)>=55&&Math.abs(dx)>Math.abs(dy)*1.35){move(dx<0?1:-1);}}, {passive:true});
 viewer.addEventListener('touchcancel',()=>{touchStart=null;},{passive:true});
 show();
});</script></body></html>
